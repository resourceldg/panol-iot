# Broker MQTT del sistema de pañoles.

listener 1883
listener 9001
protocol websockets

# Persistencia: si el broker se reinicia, las sesiones de los clientes con
# clean_session=false y sus mensajes QoS 1 pendientes sobreviven. Es lo que
# permite que un corte no se lleve eventos de auditoría que ya salieron del
# nodo pero todavía no llegaron al servidor.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice

# --- Autenticación --------------------------------------------------------
# Anónimo mientras se prueba en banco. ANTES DE MONTAR EN EL COLEGIO hay que
# cerrarlo: la subred IoT es aislada, pero un broker abierto permite que
# cualquiera con acceso a esa red publique un `acceso CONCEDIDO` falso y
# cree una sesión a nombre de quien quiera.
#
# Para cerrarlo:
#   1. docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd panol
#   2. descomentar las dos líneas de abajo y comentar allow_anonymous
#   3. docker compose restart mosquitto
#
# password_file /mosquitto/config/passwd
# allow_anonymous false
allow_anonymous true
